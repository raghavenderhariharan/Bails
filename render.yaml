# Render blueprint for the Bails ledger web service.
# Deploy by pointing Render at this repository ("New +" -> "Blueprint").
#
# The database is external (e.g. a free Neon Postgres that does not expire):
# paste its connection string into DATABASE_URL when Render prompts. To use
# Render's own free Postgres instead, see DEPLOY.md (Option B) -- note it is
# deleted ~30 days after creation.
services:
  - type: web
    name: bails-ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true          # a fresh random key; keeps sessions signed
      - key: ADMIN_PASSWORD
        sync: false                  # set this yourself in the Render dashboard
      - key: PARTNER_PASSCODE
        sync: false                  # STRONGLY recommended on a public URL:
                                     # without it, anyone with the link can read
                                     # the whole ledger. Leave blank for none.
      - key: FORCE_HTTPS
        value: "true"                # marks the session cookie Secure
      - key: TRUSTED_PROXY_COUNT
        value: "1"                   # Render puts exactly one proxy in front;
                                     # lets the login throttle see real client IPs
      - key: DATABASE_URL
        sync: false                  # paste your external Postgres connection
                                     # string (e.g. from Neon) in the dashboard.
                                     # postgres:// URLs are normalised in config.py.
