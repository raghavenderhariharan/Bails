# Render blueprint: a web service plus a free Postgres instance.
# Deploy by pointing Render at this repository ("New +" -> "Blueprint").
services:
  - type: web
    name: bails-ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true          # a fresh random key; keeps sessions signed
      - key: ADMIN_PASSWORD
        sync: false                  # set this yourself in the Render dashboard
      - key: FORCE_HTTPS
        value: "true"                # marks the session cookie Secure
      - key: TRUSTED_PROXY_COUNT
        value: "1"                   # Render puts exactly one proxy in front;
                                     # lets the login throttle see real client IPs
      - key: DATABASE_URL
        fromDatabase:
          name: bails-ledger-db
          property: connectionString

databases:
  - name: bails-ledger-db
    plan: free
    databaseName: bails_ledger
    user: bails
