{# Add/edit a watchman petty-cash entry. JS retargets the action for edits. #}
<dialog class="modal" id="pettyModal" aria-labelledby="pettyModalTitle">
  <form method="post" action="{{ url_for('watchman_petty_create') }}" id="pettyForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.full_path }}">

    <div class="modal__head">
      <h2 id="pettyModalTitle">Add petty cash</h2>
      <span class="spacer"></span>
      <button class="btn btn--sm btn--ghost btn--icon" type="button" data-close-petty aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:18px;height:18px"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="form-grid">
        <div class="field span-2">
          <label for="p-watchman">Watchman</label>
          <select id="p-watchman" name="watchman_id" required>
            <option value="">Select a watchman…</option>
            {% for w in all_watchmen %}
              <option value="{{ w.id }}">{{ w.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="p-date">Date</label>
          <input type="date" id="p-date" name="entry_date" value="{{ today_iso }}" required>
        </div>
        <div class="field">
          <label for="p-amount">Amount ({{ CURRENCY }})</label>
          <input type="text" inputmode="decimal" id="p-amount" name="amount" placeholder="2000" autocomplete="off" required>
        </div>
        <div class="field span-2">
          <label for="p-note">Note</label>
          <input type="text" id="p-note" name="note" placeholder="e.g. advance, groceries" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="modal__foot">
      <button class="btn btn--ghost" type="button" data-close-petty>Cancel</button>
      <button class="btn btn--debit" type="submit" id="pettySubmit">Save</button>
    </div>
  </form>
</dialog>
